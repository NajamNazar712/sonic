image: atlassian/default-image:3

pipelines:
  branches:
    staging:
      - step:
          name: 'Deploy to staging VM'
          deployment: staging
          script:
            - echo "Deploying to staging branch VM..."
            - ssh -o StrictHostKeyChecking=no "$STAGING_USER@$SPRINT_132_HOST" "cd /var/www/html/sonic3 && chmod +x deploy.sh && bash ./deploy.sh"

    master:
      - step:
          name: 'Deploy to Production VM'
          deployment: Production
          script:
            - echo "Deploying to production server..."
            - ssh -vvv -p "$PRODUCTION_PORT" -o StrictHostKeyChecking=no "$PRODUCTION_USER@$PRODUCTION_HOST" "cd /var/www/html/sonic && chmod +x deploy.sh && bash ./deploy.sh"